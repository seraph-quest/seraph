schema_version: 2
epic: 736
description: >-
  Keyless, read-only release-gate criteria. Source-contract checks do not
  claim live execution. Provider, edge, media, connector, evolution, and
  comparator checks are explicitly skipped or excluded until separately
  authorised evidence exists.
status_vocabulary: [pass, degraded, blocked, skipped, unknown, failed]
evidence_mode_vocabulary: [configuration, static, integration, external_unverified, excluded]
overall_status_precedence: [failed, blocked, unknown, degraded, skipped, pass]
overall_status_rules:
  - failed always returns exit 4
  - required blocked or unknown returns blocked with exit 3
  - required degraded returns degraded with exit 3
  - optional blocked, degraded, skipped, or unknown returns degraded with exit 2
  - all required pass with no optional non-pass returns pass with exit 0
exit_codes:
  pass: 0
  optional_degraded_or_skipped: 2
  required_blocked_or_unknown: 3
  failed: 4
  usage_or_config: 64
  internal: 70
criterion_fields:
  - id
  - owner_issue
  - required
  - evidence_mode
  - command_or_probe
  - expected_exit_or_result
  - artifact_path
  - live_environment
  - failure_meaning
  - residual_risk_text
exclusion_mapping:
  - id: research.harness_improvement
    owner_issue: 771
    status: excluded
    replacement: deferred_outside_epic_736
  - id: evolution.staged_candidate
    owner_issue: 771
    status: excluded
    replacement: deferred_outside_epic_736
  - id: evolution.hidden_evaluation
    owner_issue: 771
    status: excluded
    replacement: deferred_outside_epic_736
  - id: evolution.scoped_canary_rollback
    owner_issue: 771
    status: excluded
    replacement: deferred_outside_epic_736
  - id: evaluation.comparator_scope_coverage
    owner_issue: 754
    status: excluded
    replacement: deferred_outside_epic_736
criteria:
  - id: core.authenticated_origin
    owner_issue: 747
    required: true
    evidence_mode: static
    command_or_probe: health::_contract_check (source presence only)
    expected_exit_or_result: pass when the authenticated origin contract exists
    artifact_path: source-contract:core.authenticated_origin
    live_environment: repository revision; no runtime request
    failure_meaning: authenticated origin source contract is missing
    residual_risk_text: source presence does not prove an exercised ingress boundary
  - id: core.frontend
