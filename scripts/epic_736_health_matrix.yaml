schema_version: 2
epic: 736
description: >-
  Keyless, read-only release-gate criteria. Source-contract checks do not
  claim live execution. Provider, edge, media, connector, evolution, and
  comparator checks are explicitly skipped or excluded until separately
  authorised evidence exists. Required child criteria expose source presence
  only as informational checks and require a current, validated behavioral
  receipt from the owning runner; source presence never satisfies that gate.
status_vocabulary: [pass, degraded, blocked, skipped, unknown, failed]
evidence_mode_vocabulary: [configuration, static, integration, external_unverified, excluded]
overall_status_precedence: [hard_failed, required_integration_nonpass, required_blocked_or_unknown, required_degraded, optional_nonpass, pass]
overall_status_rules:
  - configuration or static failures, and failed statuses outside a required integration receipt, return failed with exit 4
  - required integration evidence that is missing, invalid, stale, mismatched, ambiguous, or any non-pass result including failed returns visibly degraded with exit 2
  - required blocked or unknown returns blocked with exit 3
  - required degraded returns degraded with exit 3
  - optional blocked, degraded, skipped, or unknown returns degraded with exit 2
  - all required pass with no optional non-pass returns pass with exit 0
exit_codes:
  pass: 0
  optional_degraded_or_skipped: 2
  required_blocked_or_unknown: 3
  failed: 4
  usage_or_config: 64
  internal: 70
child_evidence:
  schema_version: 1
  directory: operator-receipts/epic-736-child-evidence (server-owned canonical workspace path)
  accepted_results: [pass, degraded, blocked, skipped, unknown, failed]
  required_fields: [schema_version, child_issue, criterion_id, commit, command, result, timestamp, hash]
  hash: sha256 of canonical JSON object with the hash field omitted; path ownership and privacy are enforced before validation
  max_age_seconds: 86400
  current_revision_required: true
  required_criteria:
    - conversation.identity_outbox
    - native_software.loop
    - edge.paired_transport
    - audio.capture_decode_persistence
    - telegram.durable_transport
    - capability_pack.lifecycle
criterion_fields:
  - id
  - owner_issue
  - required
  - evidence_mode
  - command_or_probe
  - expected_exit_or_result
  - artifact_path
  - live_environment
  - failure_meaning
  - residual_risk_text
exclusion_mapping:
  - id: research.harness_improvement
    owner_issue: 771
    status: excluded
    replacement: deferred_outside_epic_736
  - id: evolution.staged_candidate
    owner_issue: 771
    status: excluded
    replacement: deferred_outside_epic_736
  - id: evolution.hidden_evaluation
    owner_issue: 771
    status: excluded
    replacement: deferred_outside_epic_736
  - id: evolution.scoped_canary_rollback
    owner_issue: 771
    status: excluded
    replacement: deferred_outside_epic_736
  - id: evaluation.comparator_scope_coverage
    owner_issue: 754
    status: excluded
    replacement: deferred_outside_epic_736
