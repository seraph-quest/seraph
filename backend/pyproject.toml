[project]
name = "backend"
version = "2026.11.14"
description = "Seraph's backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "litellm>=1.50.0",
    "smolagents[litellm,mcp]>=1.24.0",
    "mcp>=1.7.0",
    "packaging>=24.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "ddgs>=7.0.0",
    "websockets>=14.0",
    # Phase 1 — Persistent Identity
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.21.0",
    "alembic>=1.14.0",
    "lancedb>=0.17.0",
    # Phase 2 — Capable Executor
    "httpx>=0.28.0",
    "playwright>=1.49.0",
    "gcsa>=2.6.0",
    "google-auth-oauthlib>=1.2.0",
    "simplegmail>=4.1.0",
    # Phase 3 — The Observer
    "apscheduler>=3.11.0,<4.0.0",
    "Pillow>=11.0.0",
    # Fixed optional deterministic document parser (ADR-017)
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    # Phase 3.5 — Context Window
    "tiktoken>=0.8",
    # Vault
    "cryptography>=43.0.0",
    # Reliability
    "slowapi>=0.1.9",
    "xlsxwriter==3.2.9",
    "reportlab==5.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --strict-markers"
markers = [
    "openrouter_legacy: explicitly re-enable retired OpenRouter (ADR-035) to pin historical mechanics; never production behavior",
    "realtime(reason): the test genuinely depends on real elapsed time (kernel signals, SQLite busy handler, a real browser); reason= is required. The only exemption in scripts/check_test_determinism.py (#1218)",
]
# Determinism visibility (#1218). Leaked resources, unraisable exceptions and
# never-awaited coroutines fail the test that produced them. Any narrower
# exception below must name its tracking issue; never add a broad ignore.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error:coroutine .* was never awaited:RuntimeWarning",
    # Narrow, tracked exceptions. Later entries take precedence over the
    # errors above. Delete each one with the change that removes its cause.
    #
    # #1224: the repo worker / supervisor pipe and unreaped-child leaks are
    # excepted only for the files that exercise them, as -W in
    # scripts/run_backend_test_shard.py (TRACKED_LEAK_FILES).
    #
    # #1223: pytest-asyncio 1.3.0 asks asyncio.get_event_loop() for the "old"
    # loop when it builds a scoped runner (plugin.py _temporary_event_loop_policy).
    # On a fresh main thread that implicitly creates a loop nobody closes; the
    # loop and its self-pipe socketpair (AF_UNIX, no address) are collected
    # later. An application loop leaked the same way would match too, so the
    # #1223 leak checks replace these two; sockets with an address still fail.
    "ignore:unclosed event loop <_UnixSelectorEventLoop running=False closed=False debug=False>:ResourceWarning",
    "ignore:unclosed <socket.socket fd=\\d+, family=1, type=1, proto=0>:ResourceWarning",
    # #1222: seen in test_cordis_governed_services under the per-file
    # accounting_db engine. Per-file engines are also reached through sync
    # bridges that run asyncio.run() on a helper thread, so a pooled aiosqlite
    # connection can outlive its loop. The single database seam removes the
    # per-file engines; this entry goes with them.
    "ignore:<aiosqlite.core.Connection object at 0x[0-9a-f]+> was deleted before being closed:ResourceWarning",
]
# Liveness watchdogs, not bounds (#1218): a test still running after
# faulthandler_timeout dumps every thread's stack and keeps going; one still
# running after `timeout` fails with its node id and stack, and the file
# continues. Both sit far above any healthy test and below the shard runner's
# per-file kill, so a hang reports where it is instead of exiting 124 blind.
faulthandler_timeout = 240
timeout = 420
timeout_method = "signal"
