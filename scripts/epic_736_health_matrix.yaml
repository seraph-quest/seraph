notes:
  - A configured key, catalog row, fixture, or source file is never a live provider receipt.
  - This command never calls OpenRouter, a GPU host, a VLM wrapper, Whisper, Piper, or a connector.
  - Mutating drills belong in isolated staging/test profiles and are referenced by logical receipts.
  - Source-contract and configuration checks are explicitly static/configuration evidence; they do not claim exercised behavior.
  - The stable evolution and comparator IDs remain in the matrix as explicit exclusions; they are not silently removed or reclassified.
