name: Backend test environment
description: >-
  The toolchain every backend test lane needs (#1220): the shared Python
  runtime, uv dependencies, the reviewed Cordis build, native Node, Chromium
  and bubblewrap. Shared by the per-PR shards, the changed-test stress job and
  the scheduled determinism lanes so they test the same environment.
# Composite steps cannot carry timeout-minutes, so each command is bounded with
# coreutils `timeout` at the per-step limits the inline steps used to have.
runs:
  using: composite
  steps:
    - name: Install shared Python 3.12.15
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.15"
        architecture: x64

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Prepare shared Python runtime
      shell: bash
      working-directory: backend
      run: |
        timeout 180 /usr/bin/python3 -I -S -B scripts/prepare_ci_python_loader.py
        timeout 180 "${pythonLocation}/bin/python3.12" -I -S -B scripts/prepare_ci_shared_python.py

    - name: Install dependencies
      shell: bash
      working-directory: backend
      run: timeout 600 uv sync --group dev --python "${pythonLocation}/bin/python3.12" --python-preference only-system

    - name: Install reviewed Node 24.13.1 (npm 11.8.0) for the Cordis runtime
      uses: actions/setup-node@v4
      with:
        node-version: "24.13.1"

    - name: Build the reviewed Cordis package for discovery and Cordis suites
      shell: bash
      working-directory: runtime/cordis
      run: |
        # runtime/cordis/scripts/toolchain.mjs gates on exactly npm 11.8.0.
        if [ "$(npm --version)" != "11.8.0" ]; then timeout 120 npm install -g npm@11.8.0; fi
        test "$(npm --version)" = "11.8.0"
        timeout 180 npm ci --ignore-scripts
        timeout 120 npm run build
        echo "SERAPH_CORDIS_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"

    - name: Install Node 24.21.0 for native repository tests
      uses: actions/setup-node@v4
      with:
        node-version: "24.21.0"

    - name: Install locked TypeScript fixture dependencies
      shell: bash
      working-directory: frontend
      run: timeout 300 npm ci --ignore-scripts

    - name: Select and verify native Node test dependencies
      shell: bash
      working-directory: backend
      run: 'timeout 180 "${pythonLocation}/bin/python3.12" -I -S -B scripts/prepare_ci_node_runtime.py'

    - name: Resolve the locked Playwright version
      id: playwright
      shell: bash
      working-directory: backend
      run: |
        version="$(timeout 60 uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # Read by install_chromium.sh and by the lanes' "Classify failures" step.
        echo "SERAPH_CI_INFRA_FILE=$RUNNER_TEMP/seraph-ci-infrastructure.txt" >> "$GITHUB_ENV"
        echo "SERAPH_CI_CONFIG_FILE=$RUNNER_TEMP/seraph-ci-config.txt" >> "$GITHUB_ENV"

    # The browser build depends only on the Playwright version (#1290). The
    # -v2 entries carry the seraph-chromium.sha256 manifest checked on restore.
    - name: Restore cached Playwright browsers
      id: browser-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-chromium-${{ steps.playwright.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-v2

    - name: Install Chromium and verify its runtime libraries
      shell: bash
      working-directory: backend
      env:
        PLAYWRIGHT_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
      run: |
        timeout 120 sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,ImageOS /usr/bin/python3 -I -S -B scripts/prepare_ci_apt_mirrors.py
        status=0
        timeout 480 bash "$GITHUB_ACTION_PATH/install_chromium.sh" || status=$?
        if [ "$status" -eq 124 ]; then
          reason="Chromium setup step timed out after 480 s (exit 124)"
          echo "$reason" >> "$SERAPH_CI_INFRA_FILE"
          echo "::error title=CI infrastructure (not a test failure)::$reason"
        fi
        exit "$status"

    # Saved straight after a miss, whatever the tests later do. Concurrent
    # shards race for the same key; the losers only log a warning.
    - name: Save Playwright browsers to the cache
      if: steps.browser-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser-cache.outputs.cache-primary-key }}

    - name: Enable bubblewrap for repository isolation tests (#1065)
      shell: bash
      working-directory: backend
      run: |
        timeout 90 sudo apt-get install -y --no-install-recommends bubblewrap || { timeout 60 sudo apt-get update -q && timeout 90 sudo apt-get install -y --no-install-recommends bubblewrap; } || {
          reason="bubblewrap apt install failed or timed out (exit $?)"
          echo "$reason" >> "$SERAPH_CI_INFRA_FILE"
          echo "::error title=CI infrastructure (not a test failure)::$reason"
          exit 1
        }
        probe() { bwrap --unshare-all --unshare-user --die-with-parent --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 --symlink usr/bin /bin --proc /proc --dev /dev /usr/bin/true; }
        if ! probe; then
          # Ubuntu runners may restrict unprivileged user namespaces via
          # AppArmor. Relax it on this disposable CI runner only, so the
          # isolated repository path is genuinely exercised here.
          echo "bwrap user namespace denied; relaxing kernel.apparmor_restrict_unprivileged_userns on this CI runner"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if probe; then
          echo "SERAPH_REQUIRE_REPO_ISOLATION_TESTS=1" >> "$GITHUB_ENV"
        else
          echo "::warning::bubblewrap isolation is unavailable on this runner; isolated repository tests will skip"
        fi
