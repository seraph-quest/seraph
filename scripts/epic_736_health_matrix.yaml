    expected_exit_or_result: pass only when the owning runner emits one current, hashed, revision-bound receipt with result pass; missing, invalid, stale, mismatched, or ambiguous evidence is unknown and overall degraded with exit 2
    artifact_path: child-evidence:<sha256-prefix>
    live_environment: owning runner command recorded in the child receipt; no provider or connector call by the collector
    failure_meaning: canonical conversation identity or durable outbox behavior has no trusted current behavioral evidence
    residual_risk_text: the receipt validates child evidence shape, hash, ownership, freshness, and revision binding; it does not independently replay the cross-surface delivery run
