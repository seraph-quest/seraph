schema_version: 2
id: seraph.tool.json-format
version: 1.0.0
kind: capability-pack
publisher:
  name: Seraph
  provenance: local-reviewed
signature:
  state: unsigned-local
  signer: null
compatibility:
  seraph: ">=1"
dependencies: []
contributes:
  capabilities: [work.json-format.v1]
  skills: []
  workflows: []
  prompts: []
  sources: []
  reports: []
  evals: [evals/profile.json]
  runbooks: []
authority:
  tools: [json_format]
  filesystem: [workspace_read, workspace_write]
  network: false
  secrets: []
  approval: always
resources:
  inference_priority: interactive
  max_inference_cost_microusd: 0
  max_runtime_seconds: 10
  max_artifact_bytes: 65536
data_policy:
  classes: [internal]
  egress: []
policy_overlays: []
lifecycle:
  hooks:
    activate: required
    pause: required
    update: required
    revoke: required
    uninstall: required
  artifact_migration: preserve
  revoke_running_jobs: cancel_at_safe_checkpoint
